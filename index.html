<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOULHEARTH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1120;--panel:#1b1d2b;--panel2:#161826;--bar:#232532;--line:#292b31;--line2:#3f424d;--muted:#9397ab;--dim:#5f6377;--text:#e9e9ed;--accent:#b5abfc;--accent2:#9184d9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,input,textarea{font:inherit}
button{color:inherit}.app{height:100%;display:flex;flex-direction:column;background:var(--bg)}
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel2);z-index:30}
.brand{min-width:180px;font-size:15px;font-weight:500;letter-spacing:.22em}.search{height:31px;max-width:440px;flex:1;margin:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;color:var(--muted);cursor:text}.search svg{width:14px}.search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:11px}.search input::placeholder{color:var(--muted)}
.auth{display:flex;gap:8px;min-width:180px;justify-content:flex-end}.btn{border:1px solid transparent;background:transparent;border-radius:8px;height:30px;padding:0 13px;cursor:pointer;font-size:11px}.btn:hover{background:#1f2130}.btn.primary{border-color:var(--accent2);color:var(--accent)}.btn.primary:hover{background:rgba(145,132,217,.14)}
.body{flex:1;min-height:0;display:flex}.rail{width:184px;flex:none;border-right:1px solid var(--line);background:#12141f;padding:14px 12px;display:flex;flex-direction:column;gap:6px;z-index:20}.rail.closed{width:48px;padding:14px 0;align-items:center}.rail-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.rail.closed .rail-title{justify-content:center}.rail-title span{font:500 9px ui-monospace,monospace;letter-spacing:.16em;color:var(--dim)}.rail.closed .rail-title span{display:none}.rail-toggle{width:20px;height:20px}.rail.closed .rail-toggle{width:24px;height:24px}.navitem{height:32px;border-radius:8px;display:flex;align-items:center;gap:10px;padding:0 10px;cursor:pointer;color:var(--muted);font-size:12px}.navitem:hover{background:#1b1d2b;color:var(--text)}.navitem.active{background:#2b2e3d;color:var(--text)}.dot{width:12px;height:12px;border-radius:3px;background:#595d6c;flex:none}.active .dot{background:var(--accent)}.rail.closed .navitem{width:30px;height:30px;padding:0;justify-content:center}.rail.closed .navitem span{display:none}.rail.closed .navitem{gap:0}.rail.closed .railsep{width:22px}.railsep{height:1px;background:var(--line);margin:8px 0}.rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:12px}.rail.closed .rail-bottom{align-items:center}.newnote{height:34px;border:1px solid var(--accent2);color:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-size:11px}.newnote:hover{background:rgba(145,132,217,.14)}.rail.closed .newnote{width:30px;font-size:0}.rail.closed .newnote b{font-size:15px}.profile{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;cursor:pointer}.profile:hover{background:#1b1d2b}.avatar{width:28px;height:28px;border-radius:50%;background:#2b2e3d;border:1px solid var(--line2);flex:none;display:grid;place-items:center;color:var(--accent);font-size:10px}.rail.closed .profile{padding:0}.rail.closed .profile-info{display:none}.profile-info{display:flex;flex-direction:column;gap:3px}.profile-info strong{font-size:10px;font-weight:500}.profile-info small{font-size:9px;color:var(--dim)}
.workspace{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle at 34% 38%,rgba(145,132,217,.15),transparent 60%),radial-gradient(circle at 78% 84%,rgba(38,42,96,.55),transparent 54%),#0f1120}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(147,151,171,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(147,151,171,.05) 1px,transparent 1px);background-size:34px 34px}.stars{position:absolute;inset:0;background-image:radial-gradient(rgba(233,233,237,.6) 1px,transparent 1.4px);background-size:72px 58px;opacity:.5}
.constellation{position:absolute;inset:0;transform-origin:top left;transition:transform .2s}.link{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(181,171,252,.38),transparent);transform-origin:left center}
.window{position:absolute;border:1px solid var(--line2);border-radius:8px;background:var(--panel);box-shadow:0 6px 20px rgba(8,9,16,.45);overflow:hidden;min-width:180px;min-height:110px}.window.focus{box-shadow:0 0 34px rgba(145,132,217,.2),0 8px 24px rgba(8,9,16,.5);border-color:#5d5294}.titlebar{height:28px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 10px;cursor:grab}.titlebar:active{cursor:grabbing}.title{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:500;letter-spacing:.12em}.title i{width:8px;height:8px;border-radius:2px;background:var(--muted)}.window.focus .title i{background:var(--accent)}.win-actions{display:flex;gap:6px}.iconbtn{width:16px;height:16px;border:1px solid var(--line2);border-radius:4px;background:transparent;color:var(--muted);display:grid;place-items:center;font:600 8px ui-monospace,monospace;cursor:pointer}.iconbtn:hover{border-color:var(--accent2);color:var(--accent)}.content{height:calc(100% - 28px);overflow:auto;padding:12px}.placeholder{border:1px dashed #595d6c;border-radius:6px;background:repeating-linear-gradient(135deg,rgba(147,151,171,.08) 0 6px,transparent 6px 12px);color:#75798c;display:grid;place-items:center;font:500 8px ui-monospace,monospace;letter-spacing:.08em}.lines{display:flex;flex-direction:column;gap:7px}.line{height:6px;background:#3f424d;border-radius:2px}.line.hi{background:#4a4d5c}.biohead{display:flex;gap:12px}.bigavatar{width:54px;height:54px;border-radius:50%;background:#2b2e3d;border:1px solid var(--line2);flex:none}.tags{display:flex;gap:6px;margin-top:10px}.tag{height:20px;padding:0 9px;border:1px solid var(--line2);border-radius:999px;color:var(--muted);display:grid;place-items:center;font-size:9px}
.map-actions{position:absolute;left:20px;bottom:20px;display:flex;gap:8px;z-index:12}.pill{height:28px;padding:0 13px;border:1px solid var(--line2);border-radius:999px;background:rgba(22,24,38,.92);color:var(--muted);font-size:10.5px;cursor:pointer}.pill:hover{border-color:var(--accent2);color:var(--text)}.pill.active{border-color:var(--accent2);background:rgba(145,132,217,.12);color:var(--accent)}.map-tools{position:absolute;right:20px;bottom:20px;display:flex;align-items:flex-end;gap:8px;z-index:12}.zoom{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:rgba(22,24,38,.92)}.zoom button{width:28px;height:26px;border:0;background:transparent;border-bottom:1px solid var(--line);cursor:pointer;color:var(--muted)}.zoom button:last-child{border:0}.zoom button:hover{color:var(--accent);background:#1f2130}
.fullview{position:absolute;inset:0;background:var(--panel2);display:flex;flex-direction:column;z-index:15}.fullhead{height:36px;flex:none;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}.fullbody{flex:1;overflow:auto;padding:28px 34px}.fullgrid{max-width:1040px;display:grid;grid-template-columns:1.5fr 1fr;gap:26px}.section-stack{display:flex;flex-direction:column;gap:12px}.card{border:1px solid var(--line2);border-radius:8px;padding:14px}.section-title{font-size:20px;font-weight:500;margin-bottom:8px}.sub{font-size:11px;color:var(--muted);line-height:1.6}.media{height:180px;margin-top:10px}.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gallery-grid .media{height:130px;margin:0}.community-item{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.community-item:last-child{border:0}.mini{width:24px;height:24px;border-radius:50%;background:#3f424d;flex:none}
.listview{position:absolute;inset:0;background:rgba(15,17,32,.98);z-index:14;overflow:auto;padding:28px}.listgrid{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.listcard{border:1px solid var(--line2);border-radius:8px;padding:14px;background:#161826;cursor:pointer}.listcard:hover{border-color:var(--accent2)}.listcard h3{font-size:12px;margin:0 0 7px}.listcard p{font-size:10px;color:var(--muted);margin:0;line-height:1.5}
.overlay{position:absolute;inset:0;z-index:50;background:rgba(9,10,18,.72);display:grid;place-items:center}.modal{width:min(430px,calc(100% - 28px));background:var(--panel2);border:1px solid var(--line2);border-radius:8px;box-shadow:0 18px 48px rgba(6,7,12,.6);overflow:hidden}.modalhead{height:42px;padding:0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modalhead strong{font-size:11px;font-weight:500;letter-spacing:.12em}.modalbody{padding:18px 16px;display:flex;flex-direction:column;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:10px;color:var(--muted)}.field input,.field textarea,.field select{height:34px;border:1px solid var(--line2);border-radius:8px;background:#12141f;color:var(--text);outline:0;padding:0 10px;font-size:11px}.field textarea{height:100px;padding:10px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--accent2)}.check{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:10px;line-height:1.5}.check input{accent-color:var(--accent2)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:2px}.error{font-size:10px;color:#d9a7a7;min-height:14px}.success{font-size:10px;color:#b8d9c4}
.bridged{position:absolute;left:20px;bottom:58px;width:230px;max-height:340px;background:rgba(18,20,31,.97);border:1px solid #5d5294;border-radius:8px;box-shadow:0 12px 30px rgba(6,7,12,.6);padding:8px;z-index:16}.member{display:flex;align-items:center;gap:9px;padding:7px;border-radius:6px;cursor:pointer}.member:hover{background:#1f2130}.member .avatar{width:26px;height:26px}.member strong{display:block;font-size:10px;font-weight:500}.member small{display:block;font-size:9px;color:var(--muted);margin-top:3px}
.notes{position:absolute;right:20px;top:20px;width:280px;max-height:calc(100% - 108px);overflow:auto;background:rgba(18,20,31,.96);border:1px solid var(--line2);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;z-index:17}.note-row{border:1px solid var(--line);border-radius:7px;padding:9px;background:#161826}.note-row strong{display:block;font-size:10px;margin-bottom:4px}.note-row p{margin:0;color:var(--muted);font-size:9.5px;line-height:1.5}.note-row small{display:block;margin-top:6px;color:var(--dim);font-size:8px}
.splash{position:absolute;inset:0;z-index:100;background:radial-gradient(circle at 50% 46%,rgba(145,132,217,.16),transparent 60%),#0d0e1a;display:grid;place-items:center;animation:splash 2.4s cubic-bezier(.4,0,.2,1) forwards;cursor:pointer}.splash-inner{text-align:center}.logo{width:210px;height:210px;border:1px dashed #5d5294;border-radius:50%;display:grid;place-items:center;font:500 10px ui-monospace,monospace;letter-spacing:.18em;color:var(--muted);box-shadow:0 0 60px rgba(145,132,217,.16)}.splash-line{width:180px;height:1px;background:linear-gradient(90deg,transparent,rgba(181,171,252,.6),transparent);margin:20px auto}.splash small{font:400 9.5px ui-monospace,monospace;letter-spacing:.16em;color:var(--dim)}@keyframes splash{0%{opacity:1;transform:scale(1)}60%{opacity:1;transform:scale(1.02)}100%{opacity:0;transform:scale(1.07);visibility:hidden}}
.toast{position:absolute;right:20px;bottom:70px;z-index:90;padding:9px 12px;border:1px solid var(--line2);border-radius:7px;background:#161826;color:var(--muted);font-size:10px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media(max-width:760px){.brand{min-width:auto;font-size:13px}.search{max-width:none}.auth{min-width:auto}.rail{width:48px;padding:14px 0;align-items:center}.rail:not(.closed){width:48px}.rail .rail-title span,.rail .navitem span,.rail .profile-info{display:none}.rail .rail-title{justify-content:center}.rail .navitem{width:30px;padding:0;justify-content:center}.rail .newnote{width:30px;font-size:0}.rail .newnote b{font-size:15px}.fullgrid,.listgrid{grid-template-columns:1fr}.window{transform:scale(.88);transform-origin:top left}.notes{right:8px;top:8px;width:min(280px,calc(100% - 16px))}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">SOULHEARTH</div>
    <div class="search" onclick="document.getElementById('searchInput').focus()">
      <span>⌕</span><input id="searchInput" placeholder="Search worlds, stories, people" autocomplete="off">
    </div>
    <div class="auth"><button class="btn" onclick="openLogin()">Log in</button><button class="btn primary" onclick="openSignup()">Sign up</button></div>
  </header>
  <div class="body">
    <aside class="rail" id="rail"></aside>
    <main class="workspace" id="workspace"></main>
  </div>
</div>

<script>
const sections={
 Biography:{kind:'bio',desc:'A home for identity, biography and the people behind each constellation.'},
 Worlds:{kind:'worlds',desc:'Explore member-created worlds and follow links between them.'},
 Stories:{kind:'stories',desc:'Long-form stories, journals and narrative fragments.'},
 Artwork:{kind:'art',desc:'Artwork placeholders ready for the real visual assets.'},
 Community:{kind:'community',desc:'Latest updates, comments and gossip from the community.'},
 Devlog:{kind:'devlog',desc:'Build notes and progress updates.'},
 'Lore / Wiki':{kind:'lore',desc:'Reference material, lore and world-building notes.'},
 Gallery:{kind:'gallery',desc:'A gallery ready for real images and infinite scrolling.'}
};
const members=[
 ['Mira','worldbuilding · illustration'],['Rowan','stories · lore'],['Aster','music · worlds'],
 ['June','artwork · writing'],['Sol','design · community']
];
let state={rail:true,active:'Biography',windows:{},bridged:false,notes:false,list:false,zoom:1,search:'',splash:true,modal:null,settingsTab:'Account'};
let z=20, notes=JSON.parse(localStorage.getItem('soulhearth_notes')||'[]');

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function initials(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();}
function railHTML(){
 const groups=[['Biography','Worlds','Stories','Artwork','Community'],['Devlog','Lore / Wiki','Gallery']];
 return `<div class="rail-title"><span>SECTIONS</span><button class="iconbtn rail-toggle" onclick="toggleRail()">${state.rail?'‹':'›'}</button></div>`+
 groups.map((g,i)=>g.map(n=>`<div class="navitem ${state.active===n?'active':''}" onclick="openSection('${esc(n)}')"><i class="dot"></i><span>${n}</span></div>`).join('')+(i===0?'<div class="railsep"></div>':'')).join('')+
 `<div class="rail-bottom"><button class="newnote" onclick="openNote()"><b>+</b><span>New note</span></button>
 <div class="profile" onclick="openSettings()"><div class="avatar">SH</div><div class="profile-info"><strong>My profile</strong><small>settings</small></div></div></div>`;
}
function render(){
 document.getElementById('rail').className='rail '+(!state.rail?'closed':'');
 document.getElementById('rail').innerHTML=railHTML();
 document.getElementById('workspace').innerHTML=workspaceHTML();
 bindDrag();
}
function workspaceHTML(){
 let html=`<div class="grid"></div><div class="stars"></div><div class="constellation" style="transform:scale(${state.zoom})">
 <div class="link" style="left:290px;top:190px;width:210px;transform:rotate(-13deg)"></div>
 <div class="link" style="left:470px;top:150px;width:250px;transform:rotate(22deg)"></div>
 <div class="link" style="left:250px;top:410px;width:260px;transform:rotate(-18deg)"></div>
 <div class="link" style="left:560px;top:360px;width:230px;transform:rotate(30deg)"></div>
 ${Object.entries(state.windows).map(([name,w])=>windowHTML(name,w)).join('')}
 </div>`;
 if(!Object.keys(state.windows).length) html+=`<div style="position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:11px;pointer-events:none">Open a section from the rail to begin exploring.</div>`;
 html+=`<div class="map-actions"><button class="pill active">My constellation</button><button class="pill ${state.bridged?'active':''}" onclick="toggleBridged()">Bridged</button><button class="pill ${state.list?'active':''}" onclick="toggleList()">List view</button></div>
 <div class="map-tools"><button class="pill" onclick="replaySplash()" title="Replay entry">▶</button><div class="zoom"><button onclick="changeZoom(.1)">+</button><button onclick="changeZoom(-.1)">−</button></div></div>`;
 if(state.bridged) html+=bridgedHTML();
 if(state.notes) html+=notesHTML();
 if(state.list) html+=listHTML();
 if(state.modal) html+=modalHTML();
 if(state.splash) html+=`<div class="splash" onclick="endSplash()"><div class="splash-inner"><div class="logo">LOGO VIDEO</div><div class="splash-line"></div><small>TRANSPARENT · MUTED · AUTOPLAY · CLICK TO SKIP</small></div></div>`;
 return html;
}
function windowHTML(name,w){
 const x=w.x,y=w.y,width=w.width,height=w.height,focus=state.active===name;
 return `<section class="window ${focus?'focus':''}" data-window="${esc(name)}" style="left:${x}px;top:${y}px;width:${width}px;height:${height}px;z-index:${w.z}">
 <div class="titlebar" data-drag="${esc(name)}"><div class="title"><i></i>${esc(name).toUpperCase()}</div><div class="win-actions"><button class="iconbtn" onclick="expandSection('${esc(name)}')">⤢</button><button class="iconbtn" onclick="closeSection('${esc(name)}')">✕</button></div></div>
 <div class="content">${smallContent(name)}</div></section>`;
}
function smallContent(name){
 const k=sections[name].kind;
 if(k==='bio')return `<div class="biohead"><div class="bigavatar"></div><div class="lines" style="flex:1"><div class="line hi" style="width:70%"></div><div class="line" style="width:44%"></div><div class="line" style="width:100%;margin-top:5px"></div><div class="line" style="width:92%"></div><div class="line" style="width:74%"></div></div></div><div class="tags"><span class="tag">interest</span><span class="tag">interest</span><span class="tag">interest</span></div>`;
 if(k==='worlds')return `<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">${[1,2,3,4].map(i=>`<div><div class="placeholder" style="height:${i<3?56:44}px">WORLD</div><div style="display:flex;gap:5px;align-items:center;margin-top:5px"><div class="mini" style="width:12px;height:12px"></div><div class="line" style="width:${46+i*8}%"></div></div></div>`).join('')}</div>`;
 if(k==='stories')return `<div class="lines"><div class="line hi" style="width:64%"></div>${[100,96,88,64].map(x=>`<div class="line" style="width:${x}%"></div>`).join('')}<hr style="width:100%;border:0;border-top:1px solid var(--line)"><div class="line hi" style="width:54%"></div><div class="line" style="width:94%"></div><div class="line" style="width:80%"></div></div>`;
 if(k==='art')return `<div class="gallery-grid">${[1,2,3,4,5,6].map(i=>`<div class="placeholder" style="height:${i<4?76:58}px">${i<4?'IMAGE':''}</div>`).join('')}</div>`;
 if(k==='community')return members.slice(0,4).map(m=>`<div class="community-item"><div class="mini"></div><div style="flex:1"><div class="line hi" style="width:${44+m[0].length*4}%"></div><div class="line" style="width:88%;margin-top:5px"></div></div></div>`).join('');
 if(k==='devlog')return `<div class="lines">${[1,2,3,4].map(i=>`<div style="display:flex;gap:8px;align-items:center"><div class="line hi" style="width:34px"></div><div class="line" style="flex:1"></div></div>`).join('')}</div>`;
 if(k==='lore')return `<div class="lines"><div class="line hi" style="width:72%"></div><div class="line" style="width:100%"></div><div class="line" style="width:90%"></div><div class="line" style="width:62%"></div></div>`;
 return `<div class="gallery-grid">${[1,2,3,4].map(i=>`<div class="placeholder" style="height:${i<3?44:36}px"></div>`).join('')}</div>`;
}
function fullView(name){
 const d=sections[name],k=d.kind;
 let body=`<div class="fullview"><div class="fullhead"><div class="title"><i style="background:var(--accent)"></i>${esc(name.toUpperCase())}</div><div class="win-actions"><button class="btn" onclick="closeExpanded()">Restore</button><button class="iconbtn" onclick="closeExpanded()">✕</button></div></div><div class="fullbody">`;
 if(k==='bio')body+=`<div class="section-title">Your biography</div><p class="sub">${d.desc}</p><div class="card" style="margin-top:18px"><div class="biohead"><div class="bigavatar"></div><div><div style="font-size:13px;font-weight:500">A Soulhearth member</div><div class="sub">Add your real profile details when the backend is connected.</div></div></div><div class="tags"><span class="tag">worldbuilding</span><span class="tag">stories</span><span class="tag">art</span></div></div>`;
 else if(k==='community')body+=`<div class="section-title">Community</div><p class="sub">${d.desc}</p><div class="card" style="margin-top:18px">${members.concat(members).map(m=>`<div class="community-item"><div class="mini"></div><div><strong style="font-size:10px">${m[0]}</strong><div class="sub">${m[1]} · latest update and conversation</div></div></div>`).join('')}</div>`;
 else if(k==='gallery'||k==='art')body+=`<div class="section-title">${name}</div><p class="sub">${d.desc}</p><div class="gallery-grid" style="margin-top:18px">${Array.from({length:12},(_,i)=>`<div class="placeholder media">${i<6?'IMAGE':''}</div>`).join('')}</div>`;
 else body+=`<div class="section-title">${esc(name)}</div><p class="sub">${d.desc}</p><div class="fullgrid" style="margin-top:18px"><div class="section-stack"><div class="lines">${Array.from({length:8},(_,i)=>`<div class="line ${i===0?'hi':''}" style="width:${55+(i%4)*11}%"></div>`).join('')}</div><div class="placeholder media">SECTION MEDIA</div><div class="lines">${[94,86,91,72].map(x=>`<div class="line" style="width:${x}%"></div>`).join('')}</div></div><div class="section-stack"><div class="card"><div class="line hi" style="width:50%"></div><div class="line" style="width:100%;margin-top:9px"></div><div class="line" style="width:78%;margin-top:7px"></div></div><div class="card"><div class="line hi" style="width:42%"></div><div class="placeholder" style="height:96px;margin-top:9px"></div></div></div></div>`;
 return body+`</div></div>`;
}
let expanded=null;
function openSection(name){
 state.active=name;
 if(!state.windows[name]){let i=Object.keys(state.windows).length;let defaults=[[56,74,300,196],[432,56,300,208],[806,118,286,230],[150,330,330,222],[552,346,300,214],[906,396,224,150],[1014,216,210,140],[898,596,236,152]][i%8];state.windows[name]={x:defaults[0],y:defaults[1],width:defaults[2],height:defaults[3],z:++z};}
 else state.windows[name].z=++z;
 state.bridged=false;render();
}
function closeSection(name){delete state.windows[name];if(state.active===name)state.active=Object.keys(state.windows)[0]||'';render();}
function expandSection(name){expanded=name;document.getElementById('workspace').insertAdjacentHTML('beforeend',fullView(name));}
function closeExpanded(){document.querySelector('.fullview')?.remove();expanded=null}
function toggleRail(){state.rail=!state.rail;render()}
function toggleBridged(){state.bridged=!state.bridged;render()}
function toggleList(){state.list=!state.list;render()}
function changeZoom(v){state.zoom=Math.max(.7,Math.min(1.35,Math.round((state.zoom+v)*10)/10));render()}
function replaySplash(){state.splash=true;render()}
function endSplash(){state.splash=false;render()}
function bindDrag(){
 document.querySelectorAll('[data-drag]').forEach(bar=>{
  bar.onpointerdown=e=>{
   if(e.target.closest('button'))return;
   const name=bar.dataset.drag,w=state.windows[name],el=bar.closest('.window'),sx=e.clientX,sy=e.clientY,ox=w.x,oy=w.y;
   w.z=++z;state.active=name;bar.setPointerCapture(e.pointerId);
   const move=ev=>{w.x=ox+ev.clientX-sx;w.y=oy+ev.clientY-sy;el.style.left=w.x+'px';el.style.top=w.y+'px'};
   const up=()=>{bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',up);render()};
   bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',up);
  };
 });
}
function notesHTML(){return `<div class="notes"><div style="display:flex;justify-content:space-between;align-items:center"><strong style="font:500 9.5px ui-monospace,monospace;letter-spacing:.14em;color:var(--muted)">NOTES</strong><button class="iconbtn" onclick="toggleNotes()">✕</button></div>${notes.length?notes.map((n,i)=>`<div class="note-row"><strong>${esc(n.title)}</strong><p>${esc(n.body)}</p><small>${new Date(n.date).toLocaleString()}</small></div>`).join(''):'<div class="sub">No notes yet. Use New note to create one.</div>'}</div>`}
function toggleNotes(){state.notes=!state.notes;render()}
function openNote(){state.modal='note';render()}
function openSignup(){state.modal='signup';render()}
function openLogin(){state.modal='login';render()}
function openSettings(){state.modal='settings';render()}
function closeModal(){state.modal=null;render()}
function modalHTML(){
 if(state.modal==='note')return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><strong>NEW NOTE</strong><button class="iconbtn" onclick="closeModal()">✕</button></div><form class="modalbody" onsubmit="saveNote(event)"><div class="field"><label>Title</label><input id="noteTitle" required placeholder="A thought worth keeping"></div><div class="field"><label>Note</label><textarea id="noteBody" required placeholder="Write something for your Soulhearth..."></textarea></div><div class="field"><label>Link (optional)</label><input id="noteLink" placeholder="/worlds/example"></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Create note</button></div></form></div></div>`;
 if(state.modal==='signup')return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><strong>CREATE ACCOUNT</strong><button class="iconbtn" onclick="closeModal()">✕</button></div><form class="modalbody" onsubmit="fakeSignup(event)"><div class="field"><label>Display name</label><input id="signupName" required></div><div class="field"><label>Email</label><input id="signupEmail" type="email" required></div><div class="field"><label>Password</label><input id="signupPass" type="password" minlength="6" required></div><label class="check"><input id="newsletter" type="checkbox"> Subscribe me to the Soulhearth newsletter.</label><div class="error" id="signupError"></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Create account</button></div></form></div></div>`;
 if(state.modal==='login')return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><strong>LOG IN</strong><button class="iconbtn" onclick="closeModal()">✕</button></div><form class="modalbody" onsubmit="fakeLogin(event)"><div class="field"><label>Email</label><input id="loginEmail" type="email" required></div><div class="field"><label>Password</label><input id="loginPass" type="password" required></div><div class="error" id="loginError"></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Log in</button></div></form></div></div>`;
 return `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><strong>PROFILE SETTINGS</strong><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="modalbody"><div style="display:flex;gap:6px"><button class="pill ${state.settingsTab==='Account'?'active':''}" onclick="state.settingsTab='Account';render()">Account</button><button class="pill ${state.settingsTab==='Privacy'?'active':''}" onclick="state.settingsTab='Privacy';render()">Privacy</button><button class="pill ${state.settingsTab==='Appearance'?'active':''}" onclick="state.settingsTab='Appearance';render()">Appearance</button></div><div class="field"><label>${state.settingsTab} setting</label><input value="${state.settingsTab==='Account'?'My profile':state.settingsTab==='Privacy'?'Who can see my constellation?':'Dark'}" readonly></div><p class="sub">This is the functional front-end draft. Persistent account/authentication and server-backed settings can be connected when the backend exists.</p><div class="modal-actions"><button class="btn primary" onclick="closeModal()">Done</button></div></div></div></div>`;
}
function saveNote(e){e.preventDefault();notes.unshift({title:document.getElementById('noteTitle').value,body:document.getElementById('noteBody').value,link:document.getElementById('noteLink').value,date:Date.now()});localStorage.setItem('soulhearth_notes',JSON.stringify(notes));state.modal=null;state.notes=true;render()}
function fakeSignup(e){e.preventDefault();localStorage.setItem('soulhearth_demo_user',document.getElementById('signupName').value);state.modal=null;render();toast('Demo account created locally. Connect a backend for real accounts.')}
function fakeLogin(e){e.preventDefault();if(localStorage.getItem('soulhearth_demo_user')){state.modal=null;render();toast('Demo login successful.')}else document.getElementById('loginError').textContent='No demo account exists yet — use Sign up first.'}
function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('workspace').appendChild(t);setTimeout(()=>t.remove(),3500)}
function bridgedHTML(){return `<div class="bridged"><div style="display:flex;justify-content:space-between;align-items:center;padding:2px 4px 6px"><span style="font:500 9px ui-monospace,monospace;letter-spacing:.14em;color:var(--muted)">SHARED INTERESTS</span><button class="iconbtn" onclick="toggleBridged()">✕</button></div>${members.map(m=>`<div class="member" onclick="openMember('${esc(m[0])}')"><div class="avatar">${initials(m[0])}</div><div><strong>${esc(m[0])}</strong><small>${esc(m[1])}</small></div></div>`).join('')}<div style="padding:6px;color:var(--dim);font-size:9px">Up to 5 · click a user to open their profile</div></div>`}
function openMember(name){state.bridged=false;state.active='Biography';state.windows={Biography:{x:56,y:74,width:330,height:220,z:++z}};render();toast('Opened '+name+' demo profile.')}
function listHTML(){const q=state.search.toLowerCase();let arr=Object.keys(sections).filter(n=>!q||n.toLowerCase().includes(q)||sections[n].desc.toLowerCase().includes(q));return `<div class="listview"><div style="max-width:900px;margin:0 auto 18px"><div class="section-title">List view</div><p class="sub">The non-map fallback for navigating Soulhearth.</p></div><div class="listgrid">${arr.map(n=>`<div class="listcard" onclick="toggleList();openSection('${esc(n)}')"><h3>${esc(n)}</h3><p>${esc(sections[n].desc)}</p></div>`).join('')||'<div class="sub">No results.</div>'}</div></div>`}
document.getElementById('searchInput').addEventListener('input',e=>{state.search=e.target.value;if(state.search.trim()){state.list=true}else state.list=false;render()});
render();
setTimeout(()=>{if(state.splash){state.splash=false;render()}},2400);
</script>
</body>
</html>
