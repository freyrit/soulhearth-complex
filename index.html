<style>
:root{--bg:#0f1120;--panel:#1b1d2b;--panel2:#161826;--bar:#232532;--line:#292b31;--line2:#3f424d;--muted:#9397ab;--dim:#5f6377;--text:#e9e9ed;--accent:#b5abfc;--accent2:#9184d9}

button{color:inherit}.app{height:100%;display:flex;flex-direction:column;background:var(--bg)}

.auth{display:flex;gap:8px;min-width:180px;justify-content:flex-end}.btn{border:1px solid transparent;background:transparent;border-radius:8px;height:30px;padding:0 13px;cursor:pointer;font-size:11px}.btn:hover{background:#1f2130}.btn.primary{border-color:var(--accent2);color:var(--accent)}.btn.primary:hover{background:rgba(145,132,217,.14)}
.body{flex:1;min-height:0;display:flex}.rail{width:184px;flex:none;border-right:1px solid var(--line);background:#12141f;padding:14px 12px;display:flex;flex-direction:column;gap:6px;z-index:20}.rail.closed{width:48px;padding:14px 0;align-items:center}.rail-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.rail.closed .rail-title{justify-content:center}.rail-title span{font:500 9px ui-monospace,monospace;letter-spacing:.16em;color:var(--dim)}.rail.closed .rail-title span{display:none}.rail-toggle{width:20px;height:20px}.rail.closed .rail-toggle{width:24px;height:24px}.navitem{height:32px;border-radius:8px;display:flex;align-items:center;gap:10px;padding:0 10px;cursor:pointer;color:var(--muted);font-size:12px}.navitem:hover{background:#1b1d2b;color:var(--text)}.navitem.active{background:#2b2e3d;color:var(--text)}.dot{width:12px;height:12px;border-radius:3px;background:#595d6c;flex:none}.active .dot{background:var(--accent)}.rail.closed .navitem{width:30px;height:30px;padding:0;justify-content:center}.rail.closed .navitem span{display:none}.rail.closed .navitem{gap:0}.rail.closed .railsep{width:22px}.railsep{height:1px;background:var(--line);margin:8px 0}.rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:12px}.rail.closed .rail-bottom{align-items:center}.newnote{height:34px;border:1px solid var(--accent2);color:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-size:11px}.newnote:hover{background:rgba(145,132,217,.14)}.rail.closed .newnote{width:30px;font-size:0}.rail.closed .newnote b{font-size:15px}.profile{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;cursor:pointer}.profile:hover{background:#1b1d2b}.avatar{width:28px;height:28px;border-radius:50%;background:#2b2e3d;border:1px solid var(--line2);flex:none;display:grid;place-items:center;color:var(--accent);font-size:10px}.rail.closed .profile{padding:0}.rail.closed .profile-info{display:none}.profile-info{display:flex;flex-direction:column;gap:3px}.profile-info strong{font-size:10px;font-weight:500}.profile-info small{font-size:9px;color:var(--dim)}
#starfieldCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}.workspace-ui{position:absolute;inset:0;z-index:5;pointer-events:none}.workspace-ui .window,.workspace-ui .map-actions,.workspace-ui .map-tools,.workspace-ui .bridged,.workspace-ui .notes,.workspace-ui .listview,.workspace-ui .overlay,.workspace-ui .splash{pointer-events:auto}.workspace-ui .constellation{pointer-events:none}.workspace-ui .constellation .window{pointer-events:auto}

.star-drawer{position:absolute;left:12px;top:14px;bottom:62px;width:246px;z-index:13;background:rgba(18,20,31,.94);border:1px solid var(--line2);border-radius:9px;backdrop-filter:blur(10px);box-shadow:0 12px 32px rgba(0,0,0,.35);transition:transform .22s ease;pointer-events:auto}

.constellation{position:absolute;inset:0;transform-origin:top left;transition:transform .2s}.link{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(181,171,252,.38),transparent);transform-origin:left center}
.window{position:absolute;border:1px solid var(--line2);border-radius:8px;background:var(--panel);box-shadow:0 6px 20px rgba(8,9,16,.45);overflow:hidden;min-width:180px;min-height:110px}.window.focus{box-shadow:0 0 34px rgba(145,132,217,.2),0 8px 24px rgba(8,9,16,.5);border-color:#5d5294}.titlebar{height:28px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 10px;cursor:grab}.titlebar:active{cursor:grabbing}.title{display:flex;align-items:center;gap:8px;font-size:10px;font-weight:500;letter-spacing:.12em}.title i{width:8px;height:8px;border-radius:2px;background:var(--muted)}.window.focus .title i{background:var(--accent)}.win-actions{display:flex;gap:6px}.iconbtn{width:16px;height:16px;border:1px solid var(--line2);border-radius:4px;background:transparent;color:var(--muted);display:grid;place-items:center;font:600 8px ui-monospace,monospace;cursor:pointer}.iconbtn:hover{border-color:var(--accent2);color:var(--accent)}.content{height:calc(100% - 28px);overflow:auto;padding:12px}.placeholder{border:1px dashed #595d6c;border-radius:6px;background:repeating-linear-gradient(135deg,rgba(147,151,171,.08) 0 6px,transparent 6px 12px);color:#75798c;display:grid;place-items:center;font:500 8px ui-monospace,monospace;letter-spacing:.08em}.lines{display:flex;flex-direction:column;gap:7px}.line{height:6px;background:#3f424d;border-radius:2px}.line.hi{background:#4a4d5c}.biohead{display:flex;gap:12px}.bigavatar{width:54px;height:54px;border-radius:50%;background:#2b2e3d;border:1px solid var(--line2);flex:none}.tags{display:flex;gap:6px;margin-top:10px}.tag{height:20px;padding:0 9px;border:1px solid var(--line2);border-radius:999px;color:var(--muted);display:grid;place-items:center;font-size:9px}
.map-actions{position:absolute;left:20px;bottom:20px;display:flex;gap:8px;z-index:12}.pill{height:28px;padding:0 13px;border:1px solid var(--line2);border-radius:999px;background:rgba(22,24,38,.92);color:var(--muted);font-size:10.5px;cursor:pointer}.pill:hover{border-color:var(--accent2);color:var(--text)}.pill.active{border-color:var(--accent2);background:rgba(145,132,217,.12);color:var(--accent)}.map-tools{position:absolute;right:20px;bottom:20px;display:flex;align-items:flex-end;gap:8px;z-index:12}.zoom{display:flex;flex-direction:column;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:rgba(22,24,38,.92)}.zoom button{width:28px;height:26px;border:0;background:transparent;border-bottom:1px solid var(--line);cursor:pointer;color:var(--muted)}.zoom button:last-child{border:0}.zoom button:hover{color:var(--accent);background:#1f2130}
.fullview{position:absolute;inset:0;background:var(--panel2);display:flex;flex-direction:column;z-index:15}.fullhead{height:36px;flex:none;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px}.fullbody{flex:1;overflow:auto;padding:28px 34px}.fullgrid{max-width:1040px;display:grid;grid-template-columns:1.5fr 1fr;gap:26px}.section-stack{display:flex;flex-direction:column;gap:12px}.card{border:1px solid var(--line2);border-radius:8px;padding:14px}.section-title{font-size:20px;font-weight:500;margin-bottom:8px}.sub{font-size:11px;color:var(--muted);line-height:1.6}.media{height:180px;margin-top:10px}.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gallery-grid .media{height:130px;margin:0}.community-item{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}.community-item:last-child{border:0}.mini{width:24px;height:24px;border-radius:50%;background:#3f424d;flex:none}
.listview{position:absolute;inset:0;background:rgba(15,17,32,.98);z-index:14;overflow:auto;padding:28px}.listgrid{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.listcard{border:1px solid var(--line2);border-radius:8px;padding:14px;background:#161826;cursor:pointer}.listcard:hover{border-color:var(--accent2)}.listcard h3{font-size:12px;margin:0 0 7px}.listcard p{font-size:10px;color:var(--muted);margin:0;line-height:1.5}
.overlay{position:absolute;inset:0;z-index:50;background:rgba(9,10,18,.72);display:grid;place-items:center}.modal{width:min(430px,calc(100% - 28px));background:var(--panel2);border:1px solid var(--line2);border-radius:8px;box-shadow:0 18px 48px rgba(6,7,12,.6);overflow:hidden}.modalhead{height:42px;padding:0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modalhead strong{font-size:11px;font-weight:500;letter-spacing:.12em}.modalbody{padding:18px 16px;display:flex;flex-direction:column;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:10px;color:var(--muted)}.field input,.field textarea,.field select{height:34px;border:1px solid var(--line2);border-radius:8px;background:#12141f;color:var(--text);outline:0;padding:0 10px;font-size:11px}.field textarea{height:100px;padding:10px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--accent2)}.check{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:10px;line-height:1.5}.check input{accent-color:var(--accent2)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:2px}.error{font-size:10px;color:#d9a7a7;min-height:14px}.success{font-size:10px;color:#b8d9c4}.google-btn{width:100%;border-color:var(--line2);text-align:center}.google-btn:hover{border-color:var(--accent2);color:var(--text)}
.bridged{position:absolute;left:20px;bottom:58px;width:230px;max-height:340px;background:rgba(18,20,31,.97);border:1px solid #5d5294;border-radius:8px;box-shadow:0 12px 30px rgba(6,7,12,.6);padding:8px;z-index:16}.member{display:flex;align-items:center;gap:9px;padding:7px;border-radius:6px;cursor:pointer}.member:hover{background:#1f2130}.member .avatar{width:26px;height:26px}.member strong{display:block;font-size:10px;font-weight:500}.member small{display:block;font-size:9px;color:var(--muted);margin-top:3px}
.notes{position:absolute;right:20px;top:20px;width:280px;max-height:calc(100% - 108px);overflow:auto;background:rgba(18,20,31,.96);border:1px solid var(--line2);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;z-index:17}.note-row{border:1px solid var(--line);border-radius:7px;padding:9px;background:#161826}.note-row strong{display:block;font-size:10px;margin-bottom:4px}.note-row p{margin:0;color:var(--muted);font-size:9.5px;line-height:1.5}.note-row small{display:block;margin-top:6px;color:var(--dim);font-size:8px}
.splash{position:absolute;inset:0;z-index:100;background:radial-gradient(circle at 50% 46%,rgba(145,132,217,.16),transparent 60%),#0d0e1a;display:grid;place-items:center;animation:splash 2.4s cubic-bezier(.4,0,.2,1) forwards;cursor:pointer}.splash-inner{text-align:center}.logo{width:210px;height:210px;border:1px dashed #5d5294;border-radius:50%;display:grid;place-items:center;font:500 10px ui-monospace,monospace;letter-spacing:.18em;color:var(--muted);box-shadow:0 0 60px rgba(145,132,217,.16)}.splash-line{width:180px;height:1px;background:linear-gradient(90deg,transparent,rgba(181,171,252,.6),transparent);margin:20px auto}.splash small{font:400 9.5px ui-monospace,monospace;letter-spacing:.16em;color:var(--dim)}@keyframes splash{0%{opacity:1;transform:scale(1)}60%{opacity:1;transform:scale(1.02)}100%{opacity:0;transform:scale(1.07);visibility:hidden}}
.toast{position:absolute;right:20px;bottom:70px;z-index:90;padding:9px 12px;border:1px solid var(--line2);border-radius:7px;background:#161826;color:var(--muted);font-size:10px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.unfocus-overlay{position:absolute;inset:0;z-index:120;display:grid;place-items:center;background:rgba(9,10,18,.32);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility .2s ease}.unfocus-overlay.show{opacity:1;visibility:visible}.unfocus-card{padding:14px 20px;border:1px solid rgba(145,132,217,.42);border-radius:10px;background:rgba(18,20,31,.58);box-shadow:0 12px 34px rgba(0,0,0,.26);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);text-align:center}.unfocus-card strong{display:block;color:var(--text);font:500 10px ui-monospace,monospace;letter-spacing:.16em}.unfocus-card span{display:block;margin-top:5px;color:var(--muted);font-size:9px} .empty-hint{animation:emptyHintFade 5s ease forwards}@keyframes emptyHintFade{0%,55%{opacity:1}100%{opacity:0;visibility:hidden}}
@media(max-width:760px){.brand{min-width:auto;font-size:13px}.search{max-width:none}.auth{min-width:auto}.rail{width:48px;padding:14px 0;align-items:center}.rail:not(.closed){width:48px}.rail .rail-title span,.rail .navitem span,.rail .profile-info{display:none}.rail .rail-title{justify-content:center}.rail .navitem{width:30px;padding:0;justify-content:center}.rail .newnote{width:30px;font-size:0}.rail .newnote b{font-size:15px}.fullgrid,.listgrid{grid-template-columns:1fr}.window{transform:scale(.88);transform-origin:top left}.notes{right:8px;top:8px;width:min(280px,calc(100% - 16px))}}

<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">SOULHEARTH</div>
    <div class="search" onclick="document.getElementById('searchInput').focus()">
      <span>⌕</span><input id="searchInput" placeholder="Search worlds, stories, people" autocomplete="off">
    </div>
    <div class="auth" id="authUI"><button class="btn" onclick="openLogin()">Log in</button><button class="btn primary" onclick="openSignup()">Sign up</button></div>
  </header>
  <div class="body">
    <aside class="rail" id="rail"></aside>
    <main class="workspace" id="workspace"></main>
  </div>
</div>

<script>
const sections={
 Biography:{kind:'bio',desc:'A home for identity, biography and the people behind each constellation.'},
 Worlds:{kind:'worlds',desc:'Explore member-created worlds and follow links between them.'},
 Stories:{kind:'stories',desc:'Long-form stories, journals and narrative fragments.'},
 Artwork:{kind:'art',desc:'Artwork placeholders ready for the real visual assets.'},
 Community:{kind:'community',desc:'Latest updates, comments and gossip from the community.'},
 Devlog:{kind:'devlog',desc:'Build notes and progress updates.'},
 'Lore / Wiki':{kind:'lore',desc:'Reference material, lore and world-building notes.'},
 Gallery:{kind:'gallery',desc:'A gallery ready for real images and infinite scrolling.'}
};
const members=[
 ['Mira','worldbuilding · illustration'],['Rowan','stories · lore'],['Aster','music · worlds'],
 ['June','artwork · writing'],['Sol','design · community']
];
let state={rail:true,active:'Biography',windows:{},bridged:false,notes:false,list:false,zoom:1,search:'',splash:true,modal:null,settingsTab:'Account'};
let soulhearthUser=null;
let z=20, notes=JSON.parse(localStorage.getItem('soulhearth_notes')||'[]');

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function initials(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();}
function railHTML(){
 const groups=[['Biography','Worlds','Stories','Artwork','Community'],['Devlog','Lore / Wiki','Gallery']];
 return `<div class="rail-title"><span>SECTIONS</span><button class="iconbtn rail-toggle" onclick="toggleRail()">${state.rail?'‹':'›'}</button></div>`+
 groups.map((g,i)=>g.map(n=>`<div class="navitem ${state.active===n?'active':''}" onclick="openSection('${esc(n)}')"><i class="dot"></i><span>${n}</span></div>`).join('')+(i===0?'<div class="railsep"></div>':'')).join('')+
 `<div class="rail-bottom"><button class="newnote" onclick="openNote()"><b>+</b><span>New note</span></button>
 <div class="profile" onclick="openSettings()"><div class="avatar">SH</div><div class="profile-info"><strong>My profile</strong><small>settings</small></div></div></div>`;
}
function render(){
 document.getElementById('rail').className='rail '+(!state.rail?'closed':'');
 document.getElementById('rail').innerHTML=railHTML();
 const workspace=document.getElementById('workspace');
 if(!document.getElementById('starfieldCanvas')){
   workspace.innerHTML='<canvas id="starfieldCanvas"></canvas><div class="workspace-ui" id="workspaceUI"></div>';
   initStarfield();
 }
 document.getElementById('workspaceUI').innerHTML=workspaceHTML();
 bindDrag();
}
function workspaceHTML(){
 let html=`<div class="constellation" style="transform:scale(${state.zoom})">
 ${Object.entries(state.windows).map(([name,w])=>windowHTML(name,w)).join('')}
 </div>`;
 if(!Object.keys(state.windows).length) html+=`<div class="empty-hint" style="position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:11px;pointer-events:none">Open a section from the rail to begin exploring.</div>`;
 html+=`<div class="map-actions"><button class="pill active">My constellation</button><button class="pill ${state.bridged?'active':''}" onclick="toggleBridged()">Bridged</button><button class="pill ${state.list?'active':''}" onclick="toggleList()">List view</button></div>
 <div class="map-tools"><button class="pill" onclick="replaySplash()" title="Replay entry">▶</button><div class="zoom"><button onclick="changeZoom(.1)">+</button><button onclick="changeZoom(-.1)">−</button></div></div>`;
 if(state.bridged) html+=bridgedHTML();
 if(state.notes) html+=notesHTML();
 if(state.list) html+=listHTML();
 if(state.modal) html+=modalHTML();
 if(state.splash) html+=`<div class="splash" onclick="endSplash()"><div class="splash-inner"><div class="logo">LOGO VIDEO</div><div class="splash-line"></div><small>TRANSPARENT · MUTED · AUTOPLAY · CLICK TO SKIP</small></div></div>`;
 html+=`<div class="unfocus-overlay" id="unfocusOverlay"><div class="unfocus-card"><strong>FOCUS BACK TO THE GAME</strong><span>Your game is still running while this window is unfocused.</span></div></div>`;
 return html;
}
function windowHTML(name,w){
 const x=w.x,y=w.y,width=w.width,height=w.height,focus=state.active===name;
 return `<section class="window ${focus?'focus':''}" data-window="${esc(name)}" style="left:${x}px;top:${y}px;width:${width}px;height:${height}px;z-index:${w.z}">

  canvas.addEventListener('pointermove',e=>{if(objectDrag){const p=objectPoint(e,objectDrag.plane);if(p){p.add(objectDrag.offset);const o=objects.find(x=>x.id===objectDrag.id);o.x=p.x;o.y=p.y;o.z=p.z;meshes[o.id].position.copy(p);ring.position.copy(p);rebuildLinks()}return}if(!drag.active)return;const dx=e.clientX-drag.lastX,dy=e.clientY-drag.lastY;if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;yaw-=dx*.008;pitch=Math.max(-1.45,Math.min(1.45,pitch-dy*.008));drag.lastX=e.clientX;drag.lastY=e.clientY});
  canvas.addEventListener('pointerup',()=>{objectDrag=null;drag.active=false});canvas.addEventListener('pointercancel',()=>{objectDrag=null;drag.active=false});canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(4,Math.min(35,distance*Math.exp(e.deltaY*.001)))},{passive:false});
  const ro=new ResizeObserver(resize);ro.observe(canvas);window.addEventListener('resize',resize);resize();
  starRuntime={
   objects,meshes,get links(){return links},rebuildLinks,
   getSelected:()=>selected,
   select,
   add(type){
    const names={soul:'Soul',artifact:'Artifact',hearth:'Hearth',star:'Star'};
    const o={id:'asset_'+Math.random().toString(36).slice(2,10),type,name:names[type]+' '+(objects.filter(x=>x.type===type).length+1),x:Math.random()*5-2.5,y:Math.random()*2.6-1.3,z:Math.random()*5-2.5};
    objects.push(o);make(o);select(o.id);if(window.updateStarfieldPanels)window.updateStarfieldPanels();
   },
   rename(name){const o=objects.find(x=>x.id===selected);if(o){o.name=name||'Unnamed';if(window.updateStarfieldPanels)window.updateStarfieldPanels(false)}},
   remove(){
    if(!selected)return;const id=selected;const i=objects.findIndex(x=>x.id===id);if(i>=0)objects.splice(i,1);
    if(meshes[id]){root.remove(meshes[id]);delete meshes[id]}
    links=links.filter(p=>p[0]!==id&&p[1]!==id);rebuildLinks();selected=null;ring.visible=false;if(window.updateStarfieldPanels)window.updateStarfieldPanels();
   },
   tether(){if(selected){tetherMode=!tetherMode;if(window.updateStarfieldPanels)window.updateStarfieldPanels()}},
   isTethering:()=>tetherMode,
   tetherNames(){if(!selected)return[];return links.map(p=>p[0]===selected?objects.find(o=>o.id===p[1]):p[1]===selected?objects.find(o=>o.id===p[0]):null).filter(Boolean).map(o=>o.name)}
  };
  if(window.ensureStarfieldPanels)window.ensureStarfieldPanels();
  function frame(t){requestAnimationFrame(frame);cameraUpdate();if(selected&&meshes[selected]){const pulse=1+Math.sin(t*.004)*.09;ring.position.copy(meshes[selected].position);ring.quaternion.copy(camera.quaternion);ring.scale.setScalar((meshes[selected].userData.radius||.3)*1.55);ring.scale.multiplyScalar(pulse);meshes[selected].scale.setScalar(1+Math.sin(t*.004)*.055)}objects.forEach(o=>{if(o.id!==selected)meshes[o.id].scale.lerp(new THREE.Vector3(1,1,1),.2)});renderer.render(scene,camera)}
  requestAnimationFrame(frame);
 };
 const load=(src,cb)=>{const s=document.createElement('script');s.src=src;s.onload=cb;s.onerror=()=>cb();document.head.appendChild(s)};
 if(window.THREE)start();else load('https://unpkg.com/three@0.160.1/build/three.min.js',start);
}

let starDrawerOpen=false;
window.toggleStarSystemDrawer=function(){
 starDrawerOpen=!starDrawerOpen;
 const drawer=document.getElementById('starSystemDrawer');
 if(drawer)drawer.classList.toggle('closed',!starDrawerOpen);
 const btn=document.getElementById('starDrawerToggle');
 if(btn){btn.textContent=starDrawerOpen?'‹':'›';btn.title=starDrawerOpen?'Close star system tools':'Open star system tools'}
};
window.ensureStarfieldPanels=function(){
 const workspace=document.getElementById('workspace');
 if(!workspace||document.getElementById('starSystemDrawer'))return;
 const drawer=document.createElement('aside');
 drawer.id='starSystemDrawer';
 drawer.className='star-drawer closed';
 drawer.innerHTML=`<button id="starDrawerToggle" class="star-drawer-toggle" onclick="toggleStarSystemDrawer()" title="Open star system tools">›</button>
 <div class="star-drawer-inner">
  <div class="star-ui-title">STAR SYSTEM</div>
  <div class="star-ui-desc">Your universe is made from modular assets. Place Souls, Artifacts, Hearths and Stars anywhere, then tether any two things together.</div>
  <div class="star-add-grid">
   <button class="star-ui-btn" onclick="starRuntime&&starRuntime.add('soul')">+ Soul</button>
   <button class="star-ui-btn" onclick="starRuntime&&starRuntime.add('artifact')">+ Artifact</button>
   <button class="star-ui-btn" onclick="starRuntime&&starRuntime.add('hearth')">+ Hearth</button>
   <button class="star-ui-btn" onclick="starRuntime&&starRuntime.add('star')">+ Star</button>
  </div>
  <div class="star-asset-list" id="starAssetList"></div>
 </div>`;
 workspace.appendChild(drawer);
 const inspector=document.createElement('aside');
 inspector.id='starAssetInspector';
 inspector.className='star-inspector hidden';
 workspace.appendChild(inspector);
 updateStarfieldPanels();
};
window.updateStarfieldPanels=function(rebuildInspector=true){
 if(!starRuntime)return;
 const list=document.getElementById('starAssetList');
 const selected=starRuntime.getSelected();
 if(list)list.innerHTML=starRuntime.objects.map(o=>`<div class="star-asset-item ${selected===o.id?'selected':''}" onclick="starRuntime.select('${o.id}')"><i class="star-asset-dot"></i><span>${esc(o.name)}</span><small>${o.type}</small></div>`).join('');
 const inspector=document.getElementById('starAssetInspector');
 if(!inspector)return;
 if(!selected){inspector.classList.add('hidden');inspector.innerHTML='';return}
 const o=starRuntime.objects.find(x=>x.id===selected);
 if(!o){inspector.classList.add('hidden');return}
 inspector.classList.remove('hidden');
 const names=starRuntime.tetherNames();
 inspector.innerHTML=`<div class="star-ui-title">SELECTED ASSET</div>
 <label class="star-ui-status" style="display:block;margin-bottom:5px">NAME</label>
 <input class="star-ui-input" value="${esc(o.name)}" oninput="starRuntime.rename(this.value)">
 <div class="star-ui-status" style="margin-top:8px">TYPE · ${esc(o.type)}</div>
 <div style="height:1px;background:var(--line);margin:10px 0"></div>
 <div class="star-ui-title" style="margin-bottom:6px">TETHERS</div>
 <div class="star-ui-status">${names.length?names.map(esc).join(', '):'None'}</div>
 <div class="star-inspector-actions">
  <button class="star-ui-btn ${starRuntime.isTethering()?'active':''}" onclick="starRuntime.tether()">${starRuntime.isTethering()?'Click another asset…':'Tether to…'}</button>
  <button class="star-ui-btn" onclick="starRuntime.remove()">Delete</button>
 </div>`;
};

window.render=render;
render();
setTimeout(()=>{if(state.splash){state.splash=false;render()}},2400);
</script>
<script type="module">
  /*
   * SOULHEARTH AUTHENTICATION
   * Firebase Web SDK 12.18.0
   *
   * Replace the placeholder values below with the Firebase Web App config
   * from Firebase Console → Project settings → Your apps.
   *
   * Do NOT put Firebase Admin SDK/service-account private keys here.
   */
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    onAuthStateChanged,
    updateProfile,
    signOut
  } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';

  const firebaseConfig = {
    apiKey: 'PASTE_YOUR_FIREBASE_API_KEY_HERE',
    authDomain: 'PASTE_YOUR_FIREBASE_AUTH_DOMAIN_HERE',
    projectId: 'PASTE_YOUR_FIREBASE_PROJECT_ID_HERE',
    storageBucket: 'PASTE_YOUR_FIREBASE_STORAGE_BUCKET_HERE',
    messagingSenderId: 'PASTE_YOUR_FIREBASE_MESSAGING_SENDER_ID_HERE',
    appId: 'PASTE_YOUR_FIREBASE_APP_ID_HERE'
  };

  const firebaseConfigured = Object.values(firebaseConfig).every(
    value => value && !String(value).startsWith('PASTE_YOUR_')
  );

  window.soulhearthAuth = null;
  window.soulhearthAuthReady = Promise.resolve();

  function friendlyAuthError(error){
    const code=error?.code||'';
    const messages={
      'auth/email-already-in-use':'That email is already registered. Try logging in instead.',
      'auth/invalid-email':'Please enter a valid email address.',
      'auth/weak-password':'That password is too weak. Use a stronger password.',
      'auth/invalid-credential':'The email or password is incorrect.',
      'auth/user-disabled':'This account has been disabled.',
      'auth/too-many-requests':'Too many attempts. Please wait a moment and try again.',
      'auth/popup-closed-by-user':'The Google sign-in window was closed.',
      'auth/popup-blocked':'Your browser blocked the Google sign-in popup. Allow popups for this site and try again.',
      'auth/unauthorized-domain':'This website domain is not authorized in Firebase Authentication.',
      'auth/operation-not-allowed':'This sign-in method is not enabled in Firebase Authentication.',
      'auth/network-request-failed':'Network error. Check your connection and try again.'
    };
    return messages[code]||error?.message||'Authentication failed. Please try again.';
  }
  window.soulhearthAuthError=friendlyAuthError;

  if(firebaseConfigured){
    try{
      const app=initializeApp(firebaseConfig);
      const auth=getAuth(app);
      const googleProvider=new GoogleAuthProvider();

      window.soulhearthAuth={
        async signUp(email,password,name){
          const credential=await createUserWithEmailAndPassword(auth,email,password);
          if(name)await updateProfile(credential.user,{displayName:name});
          return credential.user;
        },
        async signIn(email,password){
          return (await signInWithEmailAndPassword(auth,email,password)).user;
        },
        async google(){
          return (await signInWithPopup(auth,googleProvider)).user;
        },
        async signOut(){
          return signOut(auth);
        }
      };

      window.soulhearthAuthReady=Promise.resolve(window.soulhearthAuth);

      onAuthStateChanged(auth,user=>{
        window.soulhearthUser=user||null;
        if(window.setSoulhearthUser)window.setSoulhearthUser(user);
        const authUI=document.getElementById('authUI');
        if(authUI){
          authUI.innerHTML=user
            ? `<span class="btn" style="color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(user.displayName||user.email||'Signed in')}</span><button class="btn primary" onclick="signOutUser()">Log out</button>`
            : `<button class="btn" onclick="openLogin()">Log in</button><button class="btn primary" onclick="openSignup()">Sign up</button>`;
        }
      });
    }catch(error){
      console.error('Soulhearth Firebase initialization failed:',error);
      window.soulhearthAuthReady=Promise.reject(error);
      window.soulhearthAuthReady.catch(()=>{});
    }
  }else{
    console.info('Soulhearth Firebase is not configured yet. Add the Firebase Web App config in index.html to enable authentication.');
    window.soulhearthAuthReady=Promise.resolve();
  }
</script>
